<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="mercury" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Baby Face Silhouette / Hearth Glow -->
  <circle cx="256" cy="190" r="110" fill="#ffffff" opacity="0.15" />
  
  <!-- Thermometer Glass -->
  <rect x="236" y="110" width="40" height="220" rx="20" fill="#ffffff" />
  <circle cx="256" cy="330" r="48" fill="#ffffff" />
  
  <!-- Mercury Liquid Inside -->
  <circle cx="256" cy="330" r="34" fill="url(#mercury)" />
  <rect x="246" y="180" width="20" height="130" rx="10" fill="url(#mercury)" />
  
  <!-- Thermometer Markings -->
  <line x1="284" y1="150" x2="296" y2="150" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>
  <line x1="284" y1="180" x2="304" y2="180" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>
  <line x1="284" y1="210" x2="296" y2="210" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>
  <line x1="284" y1="240" x2="304" y2="240" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>

  <!-- Heart / Care Symbol -->
  <path d="M370 120 C370 100, 345 85, 325 105 C305 85, 280 100, 280 120 C280 155, 325 175, 325 175 C325 175, 370 155, 370 120 Z" fill="#fbbf24" opacity="0.9" />

  <!-- App Label Arc or Text -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">BABY TEMP</text>
